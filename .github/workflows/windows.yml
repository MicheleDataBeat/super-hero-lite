name: Windows

# Windows is tested when Windows is touched. A pull request that changes only
# documents or skills never starts these jobs, so it costs no Windows runner;
# the Linux job in validate.yml still runs the whole contract on everything.
#
# The granularity is the pull request, not the commit: on a pull_request event
# the filter is evaluated against the whole pull request diff. That is the
# right granularity, since what merges is the whole diff.
#
# The paths are deliberately wider than the Windows-only files. They also cover
# the cross-platform Python that executes on a Windows runner, because that is
# where several of the platform defects this job family has caught actually
# lived: in a distribution library and in the eval suites rather than in a
# .ps1 file.

on:
  pull_request:
    paths:
      - '**/*.ps1'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
      - 'scripts/manifest.py'
      - 'distributions/*/lib/**'
      - 'distributions/*/evals/**'
      - 'distributions/claude-code/plugin/**'
      - '.claude-plugin/**'
      - 'evals/**'
  push:
    branches:
      - main
    paths:
      - '**/*.ps1'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
      - 'scripts/manifest.py'
      - 'distributions/*/lib/**'
      - 'distributions/*/evals/**'
      - 'distributions/claude-code/plugin/**'
      - '.claude-plugin/**'
      - 'evals/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package
        run: pwsh ./validate.ps1

  install:
    # The package validator cannot prove an installation. This job installs the
    # real upstream prerequisites and runs the real lifecycle against them. It
    # needs no secret: the Pocock skills, the Claude Code CLI and the
    # Superpowers plugin all install from public sources, and gh authenticates
    # with the automatic workflow token.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Matt Pocock skills
        shell: pwsh
        run: npx --yes skills add https://github.com/mattpocock/skills --skill '*' --agent claude-code --global --yes

      - name: Install the Claude Code CLI
        shell: pwsh
        run: npm install -g @anthropic-ai/claude-code

      - name: Enable the Superpowers plugin
        shell: pwsh
        run: |
          claude plugin marketplace add obra/superpowers-marketplace
          claude plugin install superpowers@superpowers-marketplace
          claude plugin list --json

      - name: Validate and install the Claude Code plugin
        shell: pwsh
        run: |
          claude plugin validate . --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          claude plugin validate distributions/claude-code/plugin --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The manifest validator cannot prove an installation, so install the
          # plugin the way a user does and read the inventory back. The local
          # source has to be written `./`: a bare `.` is rejected as an invalid
          # marketplace source, while `claude plugin validate` above accepts it.
          claude plugin marketplace add ./
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          claude plugin install super-hero-lite@super-hero-lite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installed = claude plugin list --json | ConvertFrom-Json
          $lite = @($installed | Where-Object { $_.id -eq 'super-hero-lite@super-hero-lite' })
          if ($lite.Count -ne 1 -or -not $lite[0].enabled) {
              [Console]::Error.WriteLine('ERROR: the plugin did not install enabled')
              exit 1
          }
          'PASS  the plugin installed and is enabled'

          # The SessionStart hook is shell form, so on Windows it runs under
          # Git Bash or PowerShell. `cat` is a PowerShell alias for
          # Get-Content, which round-trips through the pipeline rather than
          # copying bytes, so run it the way the host would and compare the
          # text. Nothing else exercises this shell.
          $root = $lite[0].installPath
          $printed = cat "$root/hooks/session-context.md" | Out-String
          $packaged = Get-Content -Raw 'distributions/claude-code/plugin/hooks/session-context.md'
          $normalise = { param($text) ($text -replace "`r`n", "`n").TrimEnd() }
          if ((& $normalise $printed) -ne (& $normalise $packaged)) {
              [Console]::Error.WriteLine('ERROR: the hook command does not reproduce the session context under PowerShell')
              exit 1
          }
          'PASS  the hook command reproduces the session context under PowerShell'

      - name: Install and validate the distribution
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\distributions\claude-code\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\distributions\claude-code\validate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Uninstall must remove what it owns and nothing else
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\distributions\claude-code\uninstall.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # A validator that still passes here would prove nothing at all.
          .\distributions\claude-code\validate.ps1
          if ($LASTEXITCODE -eq 0) {
              [Console]::Error.WriteLine('ERROR: the distribution still validates after uninstall')
              exit 1
          }

          $prerequisite = Join-Path $HOME '.claude/skills/tdd/SKILL.md'
          if (-not (Test-Path $prerequisite)) {
              [Console]::Error.WriteLine('ERROR: uninstall removed a prerequisite skill it does not own')
              exit 1
          }

          $remaining = claude plugin list --json | ConvertFrom-Json
          if (-not @($remaining | Where-Object { $_.id -eq 'super-hero-lite@super-hero-lite' })) {
              [Console]::Error.WriteLine('ERROR: uninstall removed the plugin, which it does not own')
              exit 1
          }
          'PASS  uninstall removed package-owned state and left the prerequisites'
          # The validator above was expected to fail, so its status is still the
          # last one set. This step's verdict is the one reached here.
          exit 0
